[project]
name = "pdfapi"
version = "0.1.0.dev1"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "dotenv>=0.9.9",
    "fastmcp[apps,tasks]>=4.0.3",
    "httpx2>=2.12.0",
    "pandas>=3.0.5",
    "py-key-value-aio[redis]>=0.4.5",
    "pydantic>=2.13.4",
    "pypdf[crypto]>=6.14.2",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-aio>=2.1.7",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-env>=1.6.0",
    "pytest-playwright>=0.8.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.20",
]
[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
testpaths = ["tests"]
timeout="5000"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest_env]
env_files = [".env", ".env.test"]

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3

[tool.coverage.run]
omit = [
    "manage.py",
    "*/migrations/*",
    "*/__init__.py",
    "*/typings.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.uv.build-backend]
source-exclude = [
    "tests/**",
    "docs/**",
    "*.log",
    "**/.DS_Store",
    "conftest.py",
]
